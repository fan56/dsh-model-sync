# CI: build, typecheck, test (including the real-cordis integration suite),
# and a real-host boot smoke on every push to main, every pull request, and a
# daily schedule.
#
# Why the smoke exists: 0.1.3 shipped with unit tests green and crashed every
# dsh boot — the fake test context could not see cordis's inject gate. CI
# therefore boots a scratch profile with the plugin mounted via the real dsh
# CLI (scripts/smoke-boot.mjs) so "loads under real cordis" is a gate, not a
# hope.
#
# Host resolution: the dsh CLI is installed from npm's rolling `alpha`
# dist-tag — never hand-pinned (the 0.1.1-rc.2 lesson: the CI pin went stale
# the moment the dev machines moved to 0.1.2-alpha and every green run was
# testing the wrong host). scripts/link-dsh-closure.mjs then re-points
# node_modules/@deepseek-ai/* at that install's closure, so typecheck, tests,
# and the smoke all run against exactly the code the host ships. The daily
# schedule re-tests against whatever the alpha line has become since the last
# push, so a new dsh alpha that breaks the plugin surfaces as a red run within
# a day instead of at the next release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily 03:41 UTC — catches upstream dsh alpha drift without hand-pinning.
    - cron: '41 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test & Boot-Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # pnpm-lock.yaml is committed and MUST be regenerated in the same
          # commit as any package.json change — CI installs frozen and fails
          # fast otherwise (the dsh-tui-pi v1.0.5 lesson).
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # engines: node >=22.19.0
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (rolling alpha tag, never hand-pinned)
        run: |
          echo "alpha @deepseek-ai/dsh: $(npm view @deepseek-ai/dsh@alpha version)"
          npm install -g @deepseek-ai/dsh@alpha --no-audit --no-fund

      - name: Link the @deepseek-ai/* closure from the installed host
        run: node scripts/link-dsh-closure.mjs

      # pnpm does not run npm pre/post hooks by default, so build explicitly
      # before test (the test files import lib/).
      - name: Build & Check (tsc)
        run: pnpm build && pnpm check

      - name: Test (unit + real-cordis integration)
        run: pnpm test

      - name: Boot smoke (real dsh host, scratch profile)
        run: node scripts/smoke-boot.mjs
