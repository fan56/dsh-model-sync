# CI: build, typecheck, test (including the real-cordis integration suite),
# and a real-host boot smoke on every push to main and every pull request.
#
# Why the smoke exists: 0.1.3 shipped with unit tests green and crashed every
# dsh boot — the fake test context could not see cordis's inject gate. CI
# therefore boots a scratch profile with the plugin mounted via the real dsh
# CLI (scripts/smoke-boot.mjs) so "loads under real cordis" is a gate, not a
# hope.
#
# The source imports @deepseek-ai/* peers; unit tests resolve them from
# devDependencies, while the smoke resolves them through a real global dsh
# install (pinned to the same rc the dev machines run — bump it together with
# the devDependencies pins).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Test & Boot-Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # pnpm-lock.yaml is committed and MUST be regenerated in the same
          # commit as any package.json change — CI installs frozen and fails
          # fast otherwise (the dsh-tui-pi v1.0.5 lesson).
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # engines: node >=22.19.0
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (real host for the boot smoke)
        run: npm install -g @deepseek-ai/dsh@0.1.1-rc.2 --no-audit --no-fund

      # pnpm does not run npm pre/post hooks by default, so build explicitly
      # before test (the test files import lib/).
      - name: Build & Check (tsc)
        run: pnpm build && pnpm check

      - name: Test (unit + real-cordis integration)
        run: pnpm test

      - name: Boot smoke (real dsh host, scratch profile)
        run: node scripts/smoke-boot.mjs
